<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14243a">
  <title>Turan Nalbanto | Turnafor Elektronik</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;
    padding:24px;background:#eef2f6;font-family:Arial,Helvetica,sans-serif;color:#172337}
    main{width:min(100%,420px);background:#fff;border-radius:22px;padding:32px 26px;
    box-shadow:0 12px 40px #14243a18;text-align:center}
    .mark{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;background:#14243a;
    color:#fff;display:grid;place-items:center;font-size:25px;font-weight:700}
    h1{font-size:25px;margin:0 0 8px} .company{color:#617087;margin-bottom:28px}
    .detail{padding:13px 0;border-top:1px solid #edf0f4;text-align:left}
    .label{display:block;font-size:12px;color:#778397;margin-bottom:5px}
    a{color:#1456a0;text-decoration:none;overflow-wrap:anywhere}
    .button{display:block;margin-top:14px;padding:15px 18px;border-radius:12px;
    background:#14243a;color:#fff;font-weight:700;text-align:center}
    .secondary{background:#edf2f8;color:#14243a}
    .hint{font-size:12px;line-height:1.5;color:#778397;margin:20px 0 0}
  </style>
</head>
<body>
  <main>
    <div class="mark">TN</div>
    <h1>TURAN NALBANTO</h1>
    <div class="company">TURNAFOR ELEKTRONİK</div>
    <div class="detail"><span class="label">Telefon</span><a href="tel:+905336091264">0533 609 12 64</a></div>
    <div class="detail"><span class="label">Web sitesi</span><a href="https://www.turnafor.com">www.turnafor.com</a></div>
    <a class="button" href="turan_nalbanto.vcf" download>Rehbere Kaydet</a>
    <a class="button secondary" href="https://www.turnafor.com">Web Sitesini Ziyaret Et</a>
    <p class="hint">Kişi kartını indirmek için “Rehbere Kaydet” düğmesine dokunun. Telefonunuzun gösterdiği kişi ekleme adımını onaylayın.</p>
  </main>
</body>
</html>
